<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none">
  <defs>
    <!-- 四变体：莫兰迪(气质轨) → accent(可读轨) 的双轨渐变，与插件里 dotStyle() 一致 -->
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92a8b3"/><stop offset="100%" stop-color="#34698c"/>
    </linearGradient>
    <linearGradient id="cinnabar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d74b4b"/><stop offset="100%" stop-color="#c53637"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8859b"/><stop offset="100%" stop-color="#d0268c"/>
    </linearGradient>
    <linearGradient id="ripple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5fa8b2"/><stop offset="100%" stop-color="#007a7b"/>
    </linearGradient>

    <!-- 氛围层：与主题 body 上那几层莫兰迪光晕同构 -->
    <radialGradient id="veil1" cx="0.14" cy="0.06" r="0.75">
      <stop offset="0%" stop-color="#5fa8b2" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#5fa8b2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="veil2" cx="0.9" cy="0.95" r="0.7">
      <stop offset="0%" stop-color="#e8859b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e8859b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="veil3" cx="0.62" cy="0.1" r="0.55">
      <stop offset="0%" stop-color="#92a8b3" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#92a8b3" stop-opacity="0"/>
    </radialGradient>

    <!-- 冷光细线：两端消隐，呼应 hr 与分隔线的处理 -->
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5fa8b2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5fa8b2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5fa8b2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#92a8b3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#92a8b3" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 底：ripple 深色的 bg -->
  <rect width="1280" height="420" fill="#0a1919"/>
  <rect width="1280" height="420" fill="url(#veil1)"/>
  <rect width="1280" height="420" fill="url(#veil2)"/>
  <rect width="1280" height="420" fill="url(#veil3)"/>

  <!-- 顶部内高光 -->
  <rect x="0" y="0" width="1280" height="1" fill="#5fa8b2" opacity="0.18"/>

  <text x="96" y="176" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif"
        font-size="64" font-weight="700" fill="#eaf4f4" letter-spacing="-1">Bloom for DSH</text>

  <!-- 标题下的渐变短横，与 markdown h1::after 同一手法 -->
  <rect x="96" y="200" width="132" height="3" rx="1.5" fill="url(#underline)"/>

  <text x="96" y="248" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif"
        font-size="21" font-weight="400" fill="#8fb0b0">把 Bloom 的莫兰迪质感搬进 DeepSeek Harness</text>
  <text x="96" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="16" font-weight="400" fill="#5f8585" letter-spacing="0.4">4 variants · light &amp; dark · OKLCH · WCAG AA</text>

  <!-- 四变体色球：外圈冷光 + 双轨渐变 -->
  <g filter="url(#glow)" opacity="0.5">
    <circle cx="900" cy="210" r="34" fill="url(#mist)"/>
    <circle cx="988" cy="210" r="34" fill="url(#cinnabar)"/>
    <circle cx="1076" cy="210" r="34" fill="url(#petal)"/>
    <circle cx="1164" cy="210" r="34" fill="url(#ripple)"/>
  </g>
  <circle cx="900" cy="210" r="34" fill="url(#mist)"/>
  <circle cx="988" cy="210" r="34" fill="url(#cinnabar)"/>
  <circle cx="1076" cy="210" r="34" fill="url(#petal)"/>
  <circle cx="1164" cy="210" r="34" fill="url(#ripple)"/>

  <text x="900" y="272" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#7fa0a0">雾蓝</text>
  <text x="988" y="272" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#7fa0a0">朱砂</text>
  <text x="1076" y="272" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#7fa0a0">花瓣</text>
  <text x="1164" y="272" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#7fa0a0">涟漪</text>

  <!-- 底部冷光分隔线 -->
  <rect x="0" y="380" width="1280" height="1" fill="url(#hairline)"/>
</svg>
