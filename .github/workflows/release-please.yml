name: Release Please

# 自动维护 version / CHANGELOG / tag / GitHub Release。
# 提交走 Conventional Commits（feat:/fix:/docs:/ci:…）即可触发：
# - 每个合并到 main 的 commit 会被收集到"待发布"清单
# - 它每周自动开（或更新）一个 Release PR
# - PR 合并后：自动打 tag、创建 GitHub Release，然后触发 publish.yml 发 npm
# 想跳版本号或回滚：close 这个 PR 并评论 /autorelease:skip 或 /autorelease:major/minor。
# 完整协议见 https://github.com/googleapis/release-please/blob/main/docs/cli.md

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每天 UTC 01:30（北京时间 09:30）兜底巡检未合并的 release PR
    - cron: '30 1 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # 用 personal PAT（cs vault: secret://github/personal-pat，仓库 secret 名 PR_PAT），
          # 而不是默认 GITHUB_TOKEN —— 后者要仓库额外勾
          # "Allow GitHub Actions to create and approve pull requests" 才开得了 PR，
          # 少这一步整条链路就不动。
          token: ${{ secrets.PR_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: false

  # 给 release-please 开出来的 PR 自动挂 auto-merge。
  #
  # ⚠️ 为什么需要这个 job：release-please 只负责「开 PR」，合并那一步设计上要人点。
  #   仓库的 allow_auto_merge 已开，这里在 PR 出来后主动去启用，条件满足即自动合并 ——
  #   这一步做完，日常发版零人工。仍然会等 branch protection 要求的 check 通过才合：
  #   「合并不需要人」不等于「合并不需要门」。
  #
  # 靠 head ref 前缀筛（release-please--），不硬编码完整分支名 —— 组件名、
  # include-component-in-tag 都会影响它生成的分支名，写死等于埋雷。
  # 找不到 PR 就安静退出：这个 workflow 在「没有待发布内容」时也会跑。
  auto-merge:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: 对 release PR 启用 auto-merge
        uses: actions/github-script@v7
        with:
          # ⚠️ 必须用 PR_PAT，不能用默认 GITHUB_TOKEN。
          #   enablePullRequestAutoMerge 是「以用户身份」执行的 GraphQL mutation，
          #   GitHub App token 调它会拿到 "Resource not accessible by integration" ——
          #   workflow 报 success、日志里一条 warning，PR 上 autoMergeRequest 却是 null。
          github-token: ${{ secrets.PR_PAT }}
          script: |
            // ⚠️ pulls.list 的 head 参数是**精确匹配**（`user:ref`），不是前缀匹配。
            //   写成 `owner:release-please--` 匹配不到
            //   `release-please--branches--main--components--<name>`，
            //   列表会返回空 —— 实测踩过一次，日志安静地打「没有待处理的 release PR」。
            //   所以这里拉全量开放 PR，在 JS 里按 ref 前缀筛。
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            })
            const releasePrs = prs.filter((pr) => pr.head.ref.startsWith('release-please--'))
            if (releasePrs.length === 0) {
              core.info(`开放 PR ${prs.length} 个，其中 release PR 0 个 —— 本次推送没有可发布内容`)
              return
            }
            // ⚠️ 启用 auto-merge **只有 GraphQL 接口**，REST 里没有对应端点 ——
            //   写 github.rest.pulls.enablePullRequestAutoMerge 会得到
            //   "is not a function"。而且它吃的是 PR 的 node_id，不是 PR 号。
            const mutation = `mutation ($prId: ID!) {
              enablePullRequestAutoMerge(input: { pullRequestId: $prId, mergeMethod: SQUASH }) {
                clientMutationId
              }
            }`
            for (const pr of releasePrs) {
              core.info(`对 #${pr.number} 启用 auto-merge: ${pr.title}`)

              // **只以 mergeable_state 判门。**
              // 试过用 checks.listForRef 逐个看结论，有两个坑：
              //   1. 它返回该 ref 的**全部**历史 run。rebuild workflow 往发版分支推
              //      commit 会触发新一轮 CI，旧那轮若是红的就一直混在里面 ——
              //      实测 bloom #47 就是这样被误判成「check:failure」，而最新的
              //      check 其实是绿的。
              //   2. 仓库里还挂着 Cursor 的 Security Reviewer / Approval Router，
              //      它们能挂 in_progress 好几分钟，却不在 branch protection 的
              //      必需检查里；等它们会把发版卡死（实测空等 15 分钟）。
              // mergeable_state 已经把「必需 check（取最新一次）、必需 review、
              // 未解决对话」全算进去了，而且是 GitHub 自己算的，不会有上面两种偏差。
              //
              // 状态语义：
              //   clean     全绿 → 合
              //   unknown   还没算出来 → 等
              //   unstable  有 check 在跑 → 等
              //   dirty     有冲突，自己修不好 → 立刻叫人
              //   blocked   **不立刻判死**：实测 bloom #47 在 rebuild workflow 推完
              //             commit 后的那一瞬是 blocked，几分钟后就变成 CLEAN 了。
              //             「撞到真门」和「状态还没稳定」在这里长得一样，
              //             只有等下去才分得开。所以只 dirty 短路。
              let state = 'unknown'
              const deadline = Date.now() + 20 * 60 * 1000
              while (Date.now() < deadline) {
                const res = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number
                })
                state = res.data.mergeable_state
                if (state === 'clean' || state === 'dirty') break

                // ⚠️ 重点加固：若因 required_conversation_resolution 被机器人的 review comment 卡在 blocked，
                //   自动将机器人（如 chatgpt-codex-connector、cursor 等）的 review thread 标记为 resolved。
                if (state === 'blocked') {
                  try {
                    const threadQuery = `query($owner: String!, $repo: String!, $number: Int!) {
                      repository(owner: $owner, name: $repo) {
                        pullRequest(number: $number) {
                          reviewThreads(first: 50) {
                            nodes {
                              id
                              isResolved
                              comments(first: 1) {
                                nodes {
                                  author { login }
                                }
                              }
                            }
                          }
                        }
                      }
                    }`
                    const tRes = await github.graphql(threadQuery, {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      number: pr.number
                    })
                    const threads = tRes?.repository?.pullRequest?.reviewThreads?.nodes || []
                    const botKeys = ['codex', 'cursor', 'bot', 'github-actions']
                    for (const th of threads) {
                      if (!th.isResolved) {
                        const author = (th.comments?.nodes?.[0]?.author?.login || '').toLowerCase()
                        const isBot = botKeys.some((k) => author.includes(k))
                        if (isBot) {
                          core.info(`自动标记机器人 ${author} 的 review thread 为已解决: ${th.id}`)
                          await github.graphql(`mutation($id: ID!) {
                            resolveReviewThread(input: { threadId: $id }) {
                              thread { id, isResolved }
                            }
                          }`, { id: th.id })
                        }
                      }
                    }
                  } catch (e) {
                    core.info(`检查/标记 review threads 异常: ${e.message}`)
                  }
                }

                core.info(`#${pr.number} 状态 ${state}，等 20s 重读`)
                await new Promise((resolve) => setTimeout(resolve, 20000))
              }

              if (state !== 'clean') {
                core.warning(
                  `#${pr.number} 状态是 ${state}，不自动合并 —— 需要人看一眼`
                )
                continue
              }

              try {
                await github.graphql(mutation, { prId: pr.node_id })
                core.info(`#${pr.number} 已挂上 auto-merge，交给 GitHub 合`)
                continue
              } catch (err) {
                core.info(`#${pr.number} 挂原生 auto-merge 未成功（${err.message}），改走直接合并`)
              }

              // 状态已经是 clean（门都过了），直接合。
              // 这不是绕过门 —— PR 照走、branch protection 照判，
              // 只是不再依赖那个时机敏感、会挑状态的接口。
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash'
              })
              core.info(`#${pr.number} 已自动合并`)
            }
