name: Release Please

# 自动维护 version / CHANGELOG / tag / GitHub Release。
# 提交走 Conventional Commits（feat:/fix:/docs:/ci:…）即可触发：
# - 每个合并到 main 的 commit 会被收集到"待发布"清单
# - main push、每日巡检和默认手动触发只创建或更新 Release PR。
# - 验收后显式合并 Release PR：随后生成 tag / GitHub Release 并触发 npm 发布。
# - 手动启用 auto_merge_release 才允许自动合并；默认 false。
# 完整协议见 https://github.com/googleapis/release-please/blob/main/docs/cli.md

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      auto_merge_release:
        description: '验收完成后，允许合并 Release PR 并触发正式发布'
        type: boolean
        required: false
        default: false
  schedule:
    # 每天 UTC 01:30（北京时间 09:30）兜底巡检未合并的 release PR
    - cron: '30 1 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # 用 personal PAT（cs vault: secret://github/personal-pat，仓库 secret 名 PR_PAT），
          # 而不是默认 GITHUB_TOKEN —— 后者要仓库额外勾
          # "Allow GitHub Actions to create and approve pull requests" 才开得了 PR，
          # 少这一步整条链路就不动。
          token: ${{ secrets.PR_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: false

  # 仅在验收后显式触发（auto_merge_release=true）时运行：等待 GitHub 计算出 clean
  # （必需检查、必需评审、未解决对话均通过），再以检查时的 head sha 合并。
  # 不自动 resolve 评审线程；非 clean 只告警交给人。
  #
  # 靠 head ref 前缀筛（release-please--），不硬编码完整分支名 —— 组件名、
  # include-component-in-tag 都会影响它生成的分支名，写死等于埋雷。
  # 找不到 PR 就安静退出：这个 workflow 在「没有待发布内容」时也会跑。
  auto-merge:
    if: github.event_name == 'workflow_dispatch' && inputs.auto_merge_release
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: 验收后合并 release PR
        uses: actions/github-script@v9
        with:
          # PR_PAT：合并后触发的 tag / Release / publish 工作流需要非 GITHUB_TOKEN 身份。
          github-token: ${{ secrets.PR_PAT }}
          script: |
            // ⚠️ pulls.list 的 head 参数是**精确匹配**（`user:ref`），不是前缀匹配。
            //   写成 `owner:release-please--` 匹配不到
            //   `release-please--branches--main--components--<name>`，
            //   列表会返回空 —— 实测踩过一次，日志安静地打「没有待处理的 release PR」。
            //   所以这里拉全量开放 PR，在 JS 里按 ref 前缀筛。
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            })
            const releasePrs = prs.filter((pr) => pr.head.ref.startsWith('release-please--'))
            if (releasePrs.length === 0) {
              core.info(`开放 PR ${prs.length} 个，其中 release PR 0 个 —— 本次推送没有可发布内容`)
              return
            }
            for (const pr of releasePrs) {
              core.info(`检查 #${pr.number}: ${pr.title}`)

              // **只以 mergeable_state 判门。**
              // 试过用 checks.listForRef 逐个看结论，有两个坑：
              //   1. 它返回该 ref 的**全部**历史 run。rebuild workflow 往发版分支推
              //      commit 会触发新一轮 CI，旧那轮若是红的就一直混在里面 ——
              //      实测 bloom #47 就是这样被误判成「check:failure」，而最新的
              //      check 其实是绿的。
              //   2. 仓库里还挂着 Cursor 的 Security Reviewer / Approval Router，
              //      它们能挂 in_progress 好几分钟，却不在 branch protection 的
              //      必需检查里；等它们会把发版卡死（实测空等 15 分钟）。
              // mergeable_state 已经把「必需 check（取最新一次）、必需 review、
              // 未解决对话」全算进去了，而且是 GitHub 自己算的，不会有上面两种偏差。
              //
              // 状态语义：
              //   clean     全绿 → 合
              //   unknown   还没算出来 → 等
              //   unstable  有 check 在跑 → 等
              //   dirty     有冲突，自己修不好 → 立刻叫人
              //   blocked   **不立刻判死**：实测 bloom #47 在 rebuild workflow 推完
              //             commit 后的那一瞬是 blocked，几分钟后就变成 CLEAN 了。
              //             「撞到真门」和「状态还没稳定」在这里长得一样，
              //             只有等下去才分得开。所以只 dirty 短路。
              let state = 'unknown'
              let headSha = ''
              const deadline = Date.now() + 20 * 60 * 1000
              while (Date.now() < deadline) {
                const res = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number
                })
                state = res.data.mergeable_state
                headSha = res.data.head.sha
                if (state === 'clean' || state === 'dirty') break

                // blocked 时只等待，不代替人处理评审：未解决对话、必需评审都由 branch protection 判定。
                // 不自动 resolve 任何 review thread —— 作者身份不能证明问题已修复。

                core.info(`#${pr.number} 状态 ${state}，等 20s 重读`)
                await new Promise((resolve) => setTimeout(resolve, 20000))
              }

              if (state !== 'clean') {
                core.warning(
                  `#${pr.number} 状态是 ${state}，不自动合并 —— 需要人看一眼`
                )
                continue
              }

              // clean 状态下 GitHub 拒绝启用 auto-merge，所以直接合并，
              // 并用 sha 钉住刚检查过的 head：head 已变化时 GitHub 拒绝合并，不会合入未审内容。
              try {
                const merged = await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                  sha: headSha
                })
                if (!merged.data.merged) throw new Error(merged.data.message || 'GitHub declined the merge')
                core.info(`#${pr.number} 已合并（head ${headSha}）`)
              } catch (err) {
                core.warning(`#${pr.number} 合并失败（${err.message}），未合并 —— 请人工检查 ${pr.html_url}`)
              }
            }
