# Dependabot —— 依赖漏洞与版本更新。
#
# 为什么要装这个（2026-10-30 补记）：
#   这个仓库此前没有 dependabot 配置，等于**依赖漏洞和上游破坏性变更
#   不会主动通知任何人**。上面那些踩坑（contrast-guard 接进 CI 时 CI 立刻
#   报 not found、playwright 版本与 DSH 0.2.0 的适配）都是靠人肉发现的 ——
#   依赖更新必须能被「推着走」，而不是靠谁想起来去看。
#
# 为什么分成两个 ecosystem：
#   npm —— 运行时/开发依赖（含 contrast-guard 这个配色校验的关键依赖）。
#   github-actions —— CI 里用的 action 有自己的发版节奏，且 playwright
#   这类 action 的版本漂移会直接影响浏览器回归测试能不能跑起来。
#
# 注意锁文件：本仓库同时存在 package-lock.json 与 pnpm-lock.yaml
# （CI 用 npm ci，本地开发也用 npm）。历史原因两套都在维护，
# dependabot 会两套都尝试更新，可能产生互相打架的 PR ——
# 所以这里只对 npm 生态开更新，pnpm-lock.yaml 由人按需同步。
# 若将来确定废弃其中一套，把另一套加回并删掉这条注释。

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      # 同类依赖合一个 PR：配色校验与打包工具升级往往要配套调，
      # 拆成多个 PR 反而不好review。
      dev-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci
