name: Publish

# 推 v* tag 时自动发 npm。与 ci.yml 的关系：CI 每次 push 都跑校验，
# 这里在发布前再跑一遍同样的三件套 —— 发布是最后一道门，不依赖
# 「之前某次 CI 应该跑过了」这种假设。
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
    steps:
      # fetch-depth: 0 —— enrich-release.mjs 要 `git describe --tags` 找上一个 tag
      # 来定区间。默认的 shallow clone(depth=1)只有一个 commit,describe 直接失败,
      # 区间退化成「只有 release commit」,而那条被脚本过滤掉 → 静默什么都不补。
      # v0.8.4 就是这么漏的:步骤跑了、退出码 0、notes 一个字没加。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # 必须 install：本插件确实零**运行时**依赖，但下面 `npm run check` 要调
      # contrast-guard（devDependency）。ci.yml 接入 contrast-guard 时补过这一步、
      # 这里漏了 —— v0.3.5 发布实测就挂在 `sh: 1: contrast-guard: not found`（exit 127），
      # 结果 tag 打出去了、npm 没发成。改依赖时两个工作流的安装步骤都要连带检查。
      - run: npm ci

      - name: 语法检查 + 自检 + 产物校验
        run: |
          node --check lib/client.js && node --check lib/index.js
          npm run check
          npm pack --dry-run --json > pack.json
          node -e "
            const f = require('./pack.json')[0].files.map(x => x.path)
            const need = ['package.json', 'cordis.patch.yml', 'lib/client.js', 'lib/index.js', 'README.md', 'LICENSE']
            const miss = need.filter(n => !f.includes(n))
            if (miss.length) { console.error('发布产物缺少: ' + miss.join(', ')); process.exit(1) }
          "

      # tag 名必须与 package.json version 一致，防止「tag 是 v0.3.5 发的却是 0.3.4」；
      # 同时探测该版本是否已发过 npm（重推同一 tag 时不报错、不重复发）
      - name: 校验 tag 与版本一致性并探测 npm
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$VER" ]; then
            echo "tag v$TAG 与 package.json version $VER 不一致"; exit 1
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if npm view "@kubor/dsh-bloom-theme@$VER" version >/dev/null 2>&1; then
            echo "published=true"  >> "$GITHUB_OUTPUT"
            echo "v$VER 已在 npm 上，将跳过 publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: npm publish
        if: steps.ver.outputs.published == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Release 由 release-please 建（它的配置里 skip-github-release: false），
      # 这里只在它没建成时补一个，绝不重复建 —— v0.3.5 实测就是两边都建，
      # 后建的这步撞 `HTTP 422 Release.tag_name already exists` 让整个 Publish 标红，
      # 而其实 npm 已经发成功了。「已经存在」是正常情况，不该算失败。
      #
      # 注意这步**不挂 published == 'false'**：npm 发没发过，跟 Release 建没建成
      # 是两件独立的事。挂上去反而让补建在最需要它的场景失效 —— npm 已发成功、
      # 但 Release 没建起来时重推 tag，published 是 true，补建会被整个跳过，
      # Release 永远补不上。幂等性由下面的 `gh release view` 探测保证，不需要外层门控。
      - name: GitHub Release（缺失时补建）
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME 已由 release-please 建好，跳过"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # release-please 的 changelog 只取 commit 的 subject 行 —— 那是
      # conventional-changelog 的规范，body 一律丢掉。而本项目的 commit body 才是
      # 有价值的部分（现象 → 根因 → 修法 → 实测数字）。于是 Release 页面上只剩
      # 一行标题，点进 commit 才知道背后是怎么回事。
      # 这一步把区间内每个 commit 的 body 折叠追加到 notes 末尾：
      # 顶部仍是简洁列表（适合扫读），底部可展开（适合想知道为什么的人）。
      # 幂等 —— 重跑不会重复追加。
      - name: Release notes 补详细说明
        run: node scripts/enrich-release.mjs "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
