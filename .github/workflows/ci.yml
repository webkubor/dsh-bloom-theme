name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # 运行时依赖仍为 0；但配色校验用的 contrast-guard 是 devDependency，必须装。
      # 首版这里写「零依赖无需 install」，接入 contrast-guard 后 CI 立刻报
      # 「contrast-guard: not found」(exit 127) —— 改依赖时要连带检查 CI 的安装步骤。
      - run: npm ci

      - name: 发布媒体门禁测试
        run: node --test test/release-media-gate.test.mjs test/release-media-cli.test.mjs

      # 只有 Release Please PR 检查候选版本的素材；日常开发保留旧版 README 不受影响。
      - name: 校验本版发布媒体
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
        run: node scripts/release-media-cli.mjs check

      - name: 语法检查
        run: node --check lib/client.js && node --check lib/index.js

      # 打包契约 + 配色对比度 + 前景色 token 反模式
      - name: 自检
        run: npm run check

      - name: 安装浏览器回归测试环境
        run: npx playwright install --with-deps chromium

      - name: 三语、浮窗交互、表格、配色与轮换浏览器回归
        run: npm run test:browser

      # 确认发布产物完整：7 个文件，且 cordis.patch.yml 在内
      # （只声明 dsh.client 或漏掉 patch 文件，装上就不进 boot graph）
      - name: 校验发布产物
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const f = require('./pack.json')[0].files.map(x => x.path)
            const need = ['package.json', 'cordis.patch.yml', 'lib/client.js', 'lib/index.js', 'README.md', 'LICENSE']
            const miss = need.filter(n => !f.includes(n))
            if (miss.length) { console.error('发布产物缺少: ' + miss.join(', ')); process.exit(1) }
            console.log('发布产物完整 (' + f.length + ' 个文件): ' + f.join(', '))
          "
